
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Israel | Acceptance Portal</title>

<style>
:root {
  --blue: #1686f7;
  --white: #f4f8ff;
  --bg: #02060d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--white);
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(ellipse at center, #0b2a4d, #061426 48%, var(--bg));
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  pointer-events: none;
  background: repeating-linear-gradient(
    115deg,
    transparent 0 80px,
    rgba(22,134,247,.055) 81px 82px,
    transparent 83px 160px
  );
  animation: drift 22s linear infinite;
}

.glow {
  position: fixed;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: #087bff;
  filter: blur(130px);
  opacity: .15;
  animation: pulse 4s ease-in-out infinite;
}

.panel {
  position: relative;
  width: min(440px, calc(100vw - 32px));
  padding: 38px 30px 30px;
  border: 1px solid rgba(120,183,255,.24);
  border-radius: 24px;
  background: linear-gradient(
    145deg,
    rgba(13,35,61,.88),
    rgba(3,11,23,.94)
  );
  box-shadow: 0 24px 90px #0009,
              inset 0 1px rgba(255,255,255,.06);
  text-align: center;
  backdrop-filter: blur(16px);
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .32em;
  color: #82bfff;
  font-weight: 800;
  text-transform: uppercase;
}

.flag-wrap {
  margin: 28px auto 25px;
  width: 154px;
  filter: drop-shadow(0 0 22px rgba(22,134,247,.23));
  animation: float 3s ease-in-out infinite;
}

.flag {
  width: 100%;
  aspect-ratio: 8 / 5;
  position: relative;
  background: white;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 8px 24px #0006;
}

.stripe {
  position: absolute;
  left: 0;
  width: 100%;
  height: 17%;
  background: #0038b8;
}

.stripe.top {
  top: 12%;
}

.stripe.bottom {
  bottom: 12%;
}

.star {
  position: absolute;
  width: 30%;
  height: auto;
  left: 35%;
  top: 35%;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 31px);
  letter-spacing: .045em;
  font-weight: 850;
}

.subtitle {
  margin: 10px 0 27px;
  color: #a9bfd8;
  font-size: 13px;
  line-height: 1.65;
}

.status {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #b8cde4;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.status span:last-child {
  color: #70b8ff;
}

.track {
  height: 5px;
  background: #132943;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  border-radius: 10px;
  background: linear-gradient(90deg, #0757d8, #61c4ff);
  box-shadow: 0 0 18px #1686f7;
}

.bottom {
  margin-top: 22px;
  color: #617d9b;
  font-size: 10px;
  letter-spacing: .14em;
}

.dot {
  display: inline-block;
  animation: blink 1.1s infinite;
}

@keyframes load {
  to { width: 100%; }
}

@keyframes drift {
  to { transform: translateX(160px); }
}

@keyframes pulse {
  50% {
    opacity: .25;
    transform: scale(1.15);
  }
}

@keyframes float {
  50% { transform: translateY(-7px); }
}

@keyframes blink {
  50% { opacity: .2; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div class="glow"></div>

<main class="panel" role="status" aria-live="polite">

  <div class="eyebrow">
    Secure Access Portal
  </div>

  <div class="flag-wrap" aria-label="Israeli flag">
    <div class="flag">
      <div class="stripe top"></div>
      <div class="stripe bottom"></div>

      <svg class="star" viewBox="0 0 100 100"
           aria-hidden="true">
        <polygon
          points="50,5 90,75 10,75"
          fill="none"
          stroke="#0038b8"
          stroke-width="6"
          stroke-linejoin="round"
        />
        <polygon
          points="50,95 10,25 90,25"
          fill="none"
          stroke="#0038b8"
          stroke-width="6"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>

  <h1>ACCEPTANCE PORTAL</h1>

  <p class="subtitle">
    Netanyahu acceptance page<br>
    Preparing your session. Please wait.
  </p>

  <div class="status">
    <span id="state">Initializing portal</span>
    <span id="percent">0%</span>
  </div>

  <div class="track">
    <div class="bar" id="bar"></div>
  </div>

  <div class="bottom">
    ISRAEL • ACCESS SYSTEM <span class="dot">●</span>
  </div>

</main>

<script>
const percent = document.getElementById("percent");
const state = document.getElementById("state");
const bar = document.getElementById("bar");

const stages = [
  [0, "Initializing portal"],
  [24, "Loading interface"],
  [51, "Verifying session"],
  [78, "Preparing acceptance page"],
  [100, "Ready"]
];

const start = performance.now();
const duration = 6000;

bar.style.animation = `load ${duration}ms cubic-bezier(.18,.7,.2,1) forwards`;

function update(now) {
  const progress = Math.min(
    100,
    Math.round(((now - start) / duration) * 100)
  );

  percent.textContent = progress + "%";

  let currentStage = stages[0][1];

  for (const [threshold, label] of stages) {
    if (progress >= threshold) {
      currentStage = label;
    }
  }

  state.textContent = currentStage;

  if (progress < 100) {
    requestAnimationFrame(update);
  }
}

requestAnimationFrame(update);
</script>
<script src="yahu.js"></script>
</body>
</html>
